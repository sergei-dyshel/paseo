# Production build. Nix (nix/desktop-package.nix) and the release workflows build from
# this file and assert the sh.paseo.desktop bundle id. Shared settings live in
# electron-builder.base.yml; the developer variant is electron-builder.dev.yml.
extends: ./electron-builder.base.yml
appId: sh.paseo.desktop
productName: Paseo
protocols:
  - name: Paseo agent link
    schemes:
      - paseo
